<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">AI Engineering Workspace</title>
  <desc id="desc">A dark navy technical banner with an abstract blue and violet AI forge mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081326"/>
      <stop offset="0.55" stop-color="#0d1b38"/>
      <stop offset="1" stop-color="#171239"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#93c5fd" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="28" fill="url(#grid)"/>
  <circle cx="300" cy="260" r="260" fill="url(#glow)"/>
  <circle cx="1330" cy="40" r="280" fill="url(#glow)" opacity="0.6"/>
  <path d="M0 430 C300 350 470 500 730 412 S1200 330 1600 430" fill="none" stroke="#60a5fa" stroke-opacity="0.13" stroke-width="2"/>
  <path d="M0 454 C300 374 470 524 730 436 S1200 354 1600 454" fill="none" stroke="#a78bfa" stroke-opacity="0.10" stroke-width="2"/>

  <g transform="translate(180 130)" filter="url(#shadow)">
    <path d="M140 20 L238 76 L238 188 L140 244 L42 188 L42 76 Z" fill="#0b1831" stroke="url(#accent)" stroke-width="6"/>
    <path d="M140 56 L206 94 L206 170 L140 208 L74 170 L74 94 Z" fill="none" stroke="#38bdf8" stroke-opacity="0.72" stroke-width="3"/>
    <path d="M140 91 L173 110 L173 148 L140 167 L107 148 L107 110 Z" fill="url(#accent)"/>
    <path d="M140 20 V-10 M238 76 L265 60 M238 188 L266 204 M140 244 V274 M42 188 L14 204 M42 76 L14 60" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round"/>
    <circle cx="140" cy="-10" r="8" fill="#c084fc"/><circle cx="265" cy="60" r="8" fill="#38bdf8"/><circle cx="266" cy="204" r="8" fill="#818cf8"/><circle cx="140" cy="274" r="8" fill="#c084fc"/><circle cx="14" cy="204" r="8" fill="#38bdf8"/><circle cx="14" cy="60" r="8" fill="#818cf8"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#f8fafc">
    <text x="560" y="225" font-size="66" font-weight="700" letter-spacing="-1.5">AI Engineering</text>
    <text x="560" y="302" font-size="66" font-weight="700" letter-spacing="-1.5" fill="url(#accent)">Workspace</text>
    <text x="565" y="356" font-size="22" letter-spacing="3" fill="#bfdbfe">OPENCLAW  •  AUTOMATION  •  PRODUCTION SYSTEMS</text>
  </g>
  <rect x="560" y="390" width="180" height="4" rx="2" fill="url(#accent)"/>
  <circle cx="1540" cy="62" r="4" fill="#38bdf8"/><circle cx="1512" cy="62" r="4" fill="#818cf8"/><circle cx="1484" cy="62" r="4" fill="#c084fc"/>
</svg>
